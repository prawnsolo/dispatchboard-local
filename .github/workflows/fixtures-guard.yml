name: Fixtures guard

# Fails any push or PR that adds real customer data (names, addresses,
# account or WO numbers) or spreadsheet/database exports to the repo.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fixtures are synthetic
        run: node scripts/check-fixtures-synthetic.mjs
